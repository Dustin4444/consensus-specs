name: Publish docs
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.3
      - name: Build docs
        run: make _copy_docs
      - uses: actions/setup-python@v5.4.1
        with:
          python-version: 3.x
      - uses: actions/cache@v4.2.4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install mkdocs==1.4.2 mkdocs-material==9.1.5 mdx-truly-sane-lists==1.3 mkdocs-awesome-pages-plugin==2.8.0
      - run: mkdocs gh-deploy --force
